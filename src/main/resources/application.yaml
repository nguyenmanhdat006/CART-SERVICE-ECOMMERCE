spring:
  application:
    name: cart-service

  datasource:
    url: jdbc:postgresql://localhost:5435/cart_db
    username: cart_user
    password: cart_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6380
      password:
      timeout: 60000
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/ecommerce
          jwk-set-uri: http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs

server:
  port: 8083
  servlet:
    context-path: /

# Swagger/OpenAPI Configuration
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    use-root-path: true
    display-query-params: true
    doc-expansion: list
  api-docs:
    path: /v3/api-docs
  show-actuator: true

# Service URLs
services:
  product-service:
    url: http://localhost:8082

# Cart Configuration
cart:
  session-timeout-minutes: 30
  redis-ttl-minutes: 60
  max-items-per-cart: 50

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.ecommerce.cartservice: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data.redis: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
